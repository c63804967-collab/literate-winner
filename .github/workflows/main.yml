
name: Diagnostico RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Baixar e verificar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = "$env:TEMP\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $download

          if (-not (Test-Path $download)) {
            throw "Download falhou."
          }

          if ((Get-Item $download).Length -eq 0) {
            throw "Arquivo vazio."
          }

          $signature = Get-AuthenticodeSignature $download

          Write-Host "Status da assinatura: $($signature.Status)"

          if ($signature.Status -ne "Valid") {
            throw "Assinatura digital invalida."
          }

          Write-Host "Download e assinatura verificados."

      - name: Testar conectividade HTTPS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hosts = @(
            "download.anydesk.com"
          )

          foreach ($hostName in $hosts) {
            Write-Host "Testando $hostName..."

            $result = Test-NetConnection `
              -ComputerName $hostName `
              -Port 443 `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              Write-Host "HTTPS acessivel."
            } else {
              Write-Host "HTTPS indisponivel."
            }
          }

      - name: Resumo do Windows
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Diagnostico concluido."
          
            
