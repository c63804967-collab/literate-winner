
name: Diagnostico AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Baixar e verificar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $download = "$env:TEMP\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."
          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $download

          if (-not (Test-Path $download)) {
            throw "O download do AnyDesk falhou."
          }

          if ((Get-Item $download).Length -eq 0) {
            throw "O arquivo baixado está vazio."
          }

          Write-Host "Download concluído."

          $signature = Get-AuthenticodeSignature $download

          Write-Host "Status da assinatura: $($signature.Status)"

          if ($signature.Status -ne "Valid") {
            throw "A assinatura digital não é válida."
          }

          Write-Host "Arquivo baixado e assinatura verificada."

      - name: Resumo do ambiente
        shell: pwsh
        run: |
          Write-Host "Sistema operacional:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Conectividade HTTPS:"
          Test-NetConnection download.anydesk.com -Port 443 |
            Select-Object ComputerName, RemotePort, TcpTestSucceeded
            
